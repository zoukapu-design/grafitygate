# XcodeGen の設定。GitHub Actions の Mac で `xcodegen generate --spec App/project.yml` を実行して .xcodeproj を作る。
name: GrafityGate
options:
  bundleIdPrefix: com.zoukapu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GrafityGate:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "GRAFITYGATE"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        UIRequiredDeviceCapabilities: [arkit]
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: "$(SUPABASE_URL)"
        SupabaseAnonKey: "$(SUPABASE_ANON_KEY)"
        NSCameraUsageDescription: "GATE を作るとき・入るときに、目の前の場所や物を写して確かめるために使います。写真から作る特徴の数字だけを送り、写真そのものは選んだときだけ送ります。"
        NSLocationWhenInUseUsageDescription: "近くの GATE を見つけ、GATE の近くにいることを確かめるために、現在地を使います。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoukapu.grafitygate
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
