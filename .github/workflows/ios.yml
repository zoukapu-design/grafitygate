# GRAFITYGATE を GitHub のクラウド Mac で組み立てる（公開リポジトリなので無料）。
# - push のたび：サーバーのルールのテスト（Linux）と、署名なしの組み立ての確認（Mac）
# - 手動で実行して「TestFlight に送る」を選んだとき：署名して TestFlight に送る
#
# 必要な Secrets（リポジトリの Settings → Secrets and variables → Actions）
#   APPLE_TEAM_ID      Apple Developer のチーム ID（10 桁）
#   ASC_KEY_ID         App Store Connect API キーの Key ID
#   ASC_ISSUER_ID      App Store Connect API の Issuer ID
#   ASC_KEY_P8         ダウンロードした .p8 ファイルの中身（BEGIN〜END を全部）
#   SUPABASE_URL       Supabase のプロジェクト URL
#   SUPABASE_ANON_KEY  Supabase の anon キー
# 秘密の値はログに出さない（GitHub が自動で伏せ字にする。こちらでも echo しない）。
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight:
        description: "TestFlight に送る（Secrets が揃っている場合）"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  sql-tests:
    # サーバーのルール（100m・120m・1 入場 1 枚・12 時間・公開範囲・ブロックなど）を、手元の PostgreSQL で確かめる
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ルールのテスト
        run: bash supabase/tests/run.sh

  build:
    needs: sql-tests
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PROJECT_DIR: App
      SCHEME: GrafityGate
      BUNDLE_ID: com.zoukapu.grafitygate
      HAS_SIGNING: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: いちばん新しい Xcode を選ぶ
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: XcodeGen を入れる
        run: brew install xcodegen

      - name: 鍵を設定する（リポジトリには残らない）
        run: |
          F="$PROJECT_DIR/Config/Secrets.xcconfig"
          : > "$F"
          # xcconfig では // がコメントになるので /$()/ に置き換える
          [ -n "$SUPABASE_URL" ] && echo "SUPABASE_URL = ${SUPABASE_URL//\/\//\/\$()\/}" >> "$F"
          [ -n "$SUPABASE_ANON_KEY" ] && echo "SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY" >> "$F"
          if [ -s "$F" ]; then echo "Supabase の鍵：あり"; else echo "Supabase の鍵：なし（サーバーなしで組み立てる）"; fi

      - name: Xcode プロジェクトを作る
        run: xcodegen generate --spec "$PROJECT_DIR/project.yml"

      - name: パッケージのキャッシュ
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('App/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 組み立ての確認（署名なし）
        if: env.HAS_SIGNING != 'true' || github.event_name == 'push' || !inputs.testflight
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT_DIR/$SCHEME.xcodeproj" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            report() { python3 -c 'import sys; t=sys.stdin.read()[-3800:]; print("::error title=%s::%s" % (sys.argv[1], t.replace("%","%25").replace("\r","").replace("\n","%0A")))' "$1"; }
            grep -E "error:|fatal|Failed" build.log | sed "s#$GITHUB_WORKSPACE/##g" | sort -u | head -60 | report "build errors"
            tail -40 build.log | sed "s#$GITHUB_WORKSPACE/##g" | report "build log tail"
            exit 1
          fi
          grep -E "warning:" build.log | sed "s#$GITHUB_WORKSPACE/##g" | grep "App/Sources" | sort -u | head -30 || true

      - name: 署名して組み立て、TestFlight に送る
        if: env.HAS_SIGNING == 'true' && github.event_name == 'workflow_dispatch' && inputs.testflight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          report() { python3 -c 'import sys; t=sys.stdin.read()[-3800:]; print("::error title=%s::%s" % (sys.argv[1], t.replace("%","%25").replace("\r","").replace("\n","%0A")))' "$1"; }

          python3 -m pip install --quiet --user --break-system-packages pyjwt cryptography >/dev/null 2>&1 \
            || python3 -m pip install --quiet --user pyjwt cryptography >/dev/null 2>&1 || true
          export ASC_KEY_PATH="$KEY_PATH"
          python3 tools/ci/asc.py cleanup-dev-certs || echo "::warning::前の開発用の証明書を取り消せませんでした"
          BN=$(python3 tools/ci/asc.py next-build-number "$BUNDLE_ID" 2>/dev/null | tail -1)
          case "$BN" in ''|*[!0-9]*) BN="${{ github.run_number }}" ;; esac
          echo "::notice::ビルド番号 $BN"

          xcodebuild archive \
            -project "$PROJECT_DIR/$SCHEME.xcodeproj" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -clonedSourcePackagesDirPath .spm \
            "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BN" > archive.log 2>&1 || true
          if ! grep -q "ARCHIVE SUCCEEDED" archive.log; then
            grep -E "error:|Error|fatal|Failed|No profiles|provisioning|Provisioning" archive.log | sort -u | head -40 | report "archive errors"
            tail -30 archive.log | report "archive log tail"
            exit 1
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" > export.log 2>&1 || {
              grep -E "error|Error|failed|Failed" export.log | sort -u | head -40 | report "export/upload errors"
              tail -30 export.log | report "export log tail"
              exit 1
            }
          echo "TestFlight にビルド $BN を送りました。届くまで 10〜30 分かかります。"

      - name: ログを残す
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            archive.log
            export.log
          if-no-files-found: ignore
