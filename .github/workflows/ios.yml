# Grafity Gate を GitHub のクラウド Mac で組み立てる（公開リポジトリなので無料）。
# - push のたび：サーバーのルールのテスト（Linux）と、署名なしの組み立ての確認（Mac）
# - 手動で実行して「TestFlight に送る」を選んだとき：署名して TestFlight に送る
#
# 必要な Secrets（リポジトリの Settings → Secrets and variables → Actions）
#   APPLE_TEAM_ID      Apple Developer のチーム ID（10 桁）
#   ASC_KEY_ID         App Store Connect API キーの Key ID
#   ASC_ISSUER_ID      App Store Connect API の Issuer ID
#   ASC_KEY_P8         ダウンロードした .p8 ファイルの中身（BEGIN〜END を全部）
#   SUPABASE_URL       Supabase のプロジェクト URL（https://xxxx.supabase.co。ホスト名だけをアプリに入れる）
#   SUPABASE_ANON_KEY  Supabase の anon キー
# 秘密の値はログに出さない（GitHub が自動で伏せ字にする。こちらでも echo しない）。
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight:
        description: "TestFlight に送る（Secrets が揃っている場合）"
        type: boolean
        default: true
      runner:
        description: "使う Mac（空なら Variables の MAC_RUNNER か macos-15-intel。Intel が混んで取りかかれないときは macos-15 など）"
        type: string
        default: ""

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  sql-tests:
    # サーバーのルール（100m・120m・1 入場 1 枚・12 時間・公開範囲・ブロックなど）を、手元の PostgreSQL で確かめる
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ルールのテスト
        run: bash supabase/tests/run.sh

  build:
    needs: sql-tests
    # Apple シリコンの Mac が混んでいて取りかかれないことがあるので、ふだんは Intel の Mac を使う。
    # 変えたいときは、リポジトリの Settings → Variables の MAC_RUNNER に名前（例：macos-15）を入れる。
    # 手動で実行するときは、使う Mac をその場で選べる（runner）
    runs-on: ${{ inputs.runner || vars.MAC_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 60
    env:
      PROJECT_DIR: App
      SCHEME: GrafityGate
      BUNDLE_ID: com.zoukapu.grafitygate
      HAS_SIGNING: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: いちばん新しい Xcode を選ぶ
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: XcodeGen を入れる
        run: brew install xcodegen

      - name: 鍵を設定する（リポジトリには残らない）
        run: |
          F="$PROJECT_DIR/Config/Secrets.xcconfig"
          : > "$F"
          # xcconfig では // がコメントになり、置き換えの書き方は Mac の bash の版で崩れる（2026-11-15：
          # ホスト名の無いアドレスが入り、起動してすぐ落ちた）。アドレスからホスト名だけを取り出して書き、
          # アプリが https:// を付ける。形がおかしいときは、ここで理由を出して止める（中身は出さない）。
          if [ -n "$SUPABASE_URL" ]; then
            HOST=$(python3 -c '
          import os, sys, urllib.parse
          raw = os.environ["SUPABASE_URL"].strip()
          u = urllib.parse.urlparse(raw if "://" in raw else "https://" + raw)
          host = (u.hostname or "").strip()
          ok = u.scheme == "https" and "." in host and all(c.isalnum() or c in "-." for c in host)
          print(host if ok else "")') || HOST=""
            if [ -z "$HOST" ]; then
              echo "::error title=鍵::SUPABASE_URL を読めませんでした。https://xxxx.supabase.co の形（最後に / やほかの文字を付けない）で入れ直してください"
              exit 1
            fi
            echo "SUPABASE_HOST = $HOST" >> "$F"
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
            case "$KEY" in *//*) echo "::error title=鍵::SUPABASE_ANON_KEY に // が入っています。鍵だけを入れ直してください"; exit 1 ;; esac
            echo "SUPABASE_ANON_KEY = $KEY" >> "$F"
          fi
          if grep -q SUPABASE_HOST "$F" && grep -q SUPABASE_ANON_KEY "$F"; then
            echo "::notice title=鍵::Supabase の鍵：あり（アドレスの形も確かめた）"
          elif [ -s "$F" ]; then
            echo "::warning title=鍵::Supabase の鍵が片方しかありません（SUPABASE_URL と SUPABASE_ANON_KEY の両方が要る）"
          else
            echo "::warning title=鍵::Supabase の鍵：なし（サーバーなしで組み立てる）"
          fi
          if [ "$HAS_SIGNING" = "true" ]; then echo "::notice title=鍵::TestFlight の鍵：あり"; else echo "::warning title=鍵::TestFlight の鍵：なし（APPLE_TEAM_ID・ASC_KEY_ID・ASC_ISSUER_ID・ASC_KEY_P8）"; fi

      - name: Xcode プロジェクトを作る
        run: xcodegen generate --spec "$PROJECT_DIR/project.yml"

      - name: パッケージのキャッシュ
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('App/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 組み立ての確認（署名なし）
        if: env.HAS_SIGNING != 'true' || github.event_name == 'push' || !inputs.testflight
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT_DIR/$SCHEME.xcodeproj" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            report() { python3 -c 'import sys; t=sys.stdin.read()[-3800:]; print("::error title=%s::%s" % (sys.argv[1], t.replace("%","%25").replace("\r","").replace("\n","%0A")))' "$1"; }
            grep -E "error:|fatal|Failed" build.log | sed "s#$GITHUB_WORKSPACE/##g" | sort -u | head -60 | report "build errors"
            tail -40 build.log | sed "s#$GITHUB_WORKSPACE/##g" | report "build log tail"
            exit 1
          fi
          grep -E "warning:" build.log | sed "s#$GITHUB_WORKSPACE/##g" | grep "App/Sources" | sort -u | head -30 || true

      - name: 署名して組み立て、TestFlight に送る
        if: env.HAS_SIGNING == 'true' && github.event_name == 'workflow_dispatch' && inputs.testflight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/asc_key.p8"
          # 貼り方の違い（Windows の改行・BEGIN〜END の行なし）をそろえる。中身は表に出さない
          printf '%s' "$ASC_KEY_P8" | python3 -c '
          import sys, textwrap
          k = sys.stdin.read().replace("\r", "").strip()
          if "BEGIN" not in k:
              body = "".join(k.split())
              k = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----"
          sys.stdout.write(k + "\n")' > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          report() { python3 -c 'import sys; t=sys.stdin.read()[-3800:]; print("::error title=%s::%s" % (sys.argv[1], t.replace("%","%25").replace("\r","").replace("\n","%0A")))' "$1"; }

          python3 -m pip install --quiet --user --break-system-packages pyjwt cryptography >/dev/null 2>&1 \
            || python3 -m pip install --quiet --user pyjwt cryptography >/dev/null 2>&1 || true
          export ASC_KEY_PATH="$KEY_PATH"
          # 鍵が通るか・アプリが登録されているかを先に確かめる（だめなら、理由を注記に出して止める）
          python3 tools/ci/asc.py check "$BUNDLE_ID" || exit 1
          python3 tools/ci/asc.py cleanup-dev-certs || echo "::warning::前の開発用の証明書を取り消せませんでした"
          BN=$(python3 tools/ci/asc.py next-build-number "$BUNDLE_ID" 2>/dev/null | tail -1) || BN=""
          case "$BN" in ''|*[!0-9]*) BN="${{ github.run_number }}" ;; esac
          echo "::notice::ビルド番号 $BN"

          xcodebuild archive \
            -project "$PROJECT_DIR/$SCHEME.xcodeproj" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -clonedSourcePackagesDirPath .spm \
            "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BN" > archive.log 2>&1 || true
          if ! grep -q "ARCHIVE SUCCEEDED" archive.log; then
            grep -E "error:|Error|fatal|Failed|No profiles|provisioning|Provisioning" archive.log | sort -u | head -40 | report "archive errors"
            tail -30 archive.log | report "archive log tail"
            exit 1
          fi

          # 送る前に、組み立てたアプリにサーバーのホスト名が正しく入っているかを確かめる（中身は出さない）
          PL=$(find "$RUNNER_TEMP/$SCHEME.xcarchive/Products/Applications" -maxdepth 2 -name Info.plist | head -1)
          H=$(/usr/libexec/PlistBuddy -c "Print :SupabaseHost" "$PL" 2>/dev/null || true)
          if ! printf '%s' "$H" | grep -Eq '^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'; then
            echo "::error title=鍵::組み立てたアプリにサーバーのアドレスが正しく入っていません。TestFlight には送りません"
            exit 1
          fi
          echo "::notice title=鍵::組み立てたアプリのサーバーのアドレス：形は正しい"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" > export.log 2>&1 || {
              grep -E "error|Error|failed|Failed" export.log | sort -u | head -40 | report "export/upload errors"
              tail -30 export.log | report "export log tail"
              exit 1
            }
          echo "TestFlight にビルド $BN を送りました。届くまで 10〜30 分かかります。"

      - name: ログを残す
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            archive.log
            export.log
          if-no-files-found: ignore
