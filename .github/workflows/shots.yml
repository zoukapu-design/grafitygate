name: 画面の見本

# シミュレーターで見本のデータの画面を開いて撮り、shots ブランチに置く（Claude が文字やボタンの重なりを確かめる）。
# 見本は Debug の組み立てだけにある画面（App/Sources/Screens/Demo/DemoGallery.swift）。つなぐ先は見本のサーバー
# （DemoServer.swift。本物のサーバーにはつながない）。小さい iPhone と大きい iPhone を同時に撮り、最後にまとめる。
on:
  workflow_dispatch:
    inputs:
      screens:
        description: "撮る画面（空なら全部。例：cards nearby）"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: shots
  cancel-in-progress: true

jobs:
  shoot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: small
            device: "iPhone SE"
          - label: large
            device: "Pro Max"
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 50
    env:
      PROJECT_DIR: App
      SCHEME: GrafityGate
    steps:
      - uses: actions/checkout@v4

      - name: いちばん新しい Xcode を選ぶ
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: XcodeGen を入れる
        run: brew install xcodegen

      - name: Xcode プロジェクトを作る（鍵なし）
        run: |
          : > "$PROJECT_DIR/Config/Secrets.xcconfig"
          xcodegen generate --spec "$PROJECT_DIR/project.yml"

      - name: パッケージのキャッシュ
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('App/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: シミュレーター用に組み立てる
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT_DIR/$SCHEME.xcodeproj" -scheme "$SCHEME" \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            report() { python3 -c 'import sys; t=sys.stdin.read()[-3800:]; print("::error title=%s::%s" % (sys.argv[1], t.replace("%","%25").replace("\r","").replace("\n","%0A")))' "$1"; }
            grep -E "error:|fatal|Failed" build.log | sed "s#$GITHUB_WORKSPACE/##g" | sort -u | head -60 | report "build errors"
            exit 1
          fi
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" >> "$GITHUB_ENV"

      - name: シミュレーターを起こす（組み立てのあと。同時にすると組み立てが 3 倍遅くなった）
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          want = sys.argv[1]
          devs = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devs.items(), reverse=True):
              if "iOS" not in runtime: continue
              for d in items:
                  if want in d["name"]:
                      print(d["udid"]); sys.exit(0)
          ' "${{ matrix.device }}")
          if [ -z "$UDID" ]; then echo "::error title=見本::${{ matrix.device }} のシミュレーターがありません"; exit 1; fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: 撮る
        env:
          SCREENS_IN: ${{ inputs.screens }}
          LABEL: ${{ matrix.label }}
        run: |
          SCREENS="${SCREENS_IN:-home gate gate-outside gate-board gate-albums gate-letters gate-then trail me map profile inbox messages friends visited saved-cards letters albums settings cards nearby nearby-detail chat lookback goal board edit-card edit-gate progress notifications onboarding}"
          mkdir -p shots/logs
          # 決まった秒数で必ず止める（止まらないものは強制的に終わらせる）
          limit() {
            local t=$1; shift
            "$@" & local p=$!
            ( sleep "$t"; kill -9 "$p" 2>/dev/null ) & local k=$!
            wait "$p"; local rc=$?
            kill "$k" 2>/dev/null; wait "$k" 2>/dev/null
            return $rc
          }
          # 画面が落ち着いたか：アプリが何か出していて、3 秒なにも増えず、画面が止まったままでない
          settled() {
            [ -s "$1" ] || return 1
            local age=$(( $(date +%s) - $(stat -f %m "$1") ))
            [ "$age" -ge 3 ] || return 1
            python3 -c 'import sys; t=open(sys.argv[1], errors="replace").read(); sys.exit(1 if t.rfind("画面が止まっています") > t.rfind("画面が動き出しました") else 0)' "$1"
          }
          START=$(date +%s)
          limit 300 xcrun simctl bootstatus "$UDID" -b > /dev/null || true
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          # 見本の位置（渋谷あたり）と、位置を使ってよいこと
          xcrun simctl privacy "$UDID" grant location-always "$BUNDLE" || xcrun simctl privacy "$UDID" grant location "$BUNDLE" || true
          xcrun simctl location "$UDID" set 35.6590,139.7010 || true
          # はじめの 1 回はアプリの起動がとても遅い（入れたばかり）ので、撮らずに 1 回開いておく
          limit 60 xcrun simctl launch "$UDID" "$BUNDLE" -GGDemoScreen settings > /dev/null 2>&1 || true
          sleep 15
          for s in $SCREENS; do
            # 時間の上限が近づいたら、撮れたところまでで終える
            if [ $(( $(date +%s) - START )) -gt 1500 ]; then echo "::warning title=見本::時間が足りないので $LABEL の $s から先は撮りません"; break; fi
            limit 60 xcrun simctl terminate "$UDID" "$BUNDLE" > /dev/null 2>&1 || true
            # アプリが出した文（落ちた理由・見本のサーバーへの問い合わせ・画面が止まった）を、画面ごとに logs/ に残す
            LOG="$PWD/shots/logs/$LABEL-$s.txt"
            : > "$LOG"
            # 起動の答えはファイルで受ける（パイプで受けると、アプリが出口をつかんだままで待ち続ける）
            limit 60 xcrun simctl launch --stdout="$LOG" --stderr="$LOG" "$UDID" "$BUNDLE" -GGDemoScreen "$s" \
              -AppleLanguages "(ja)" -AppleLocale ja_JP > /tmp/launch.txt 2>&1 || echo "::warning title=見本::$LABEL の $s を開けませんでした"
            # 少なくとも 8 秒、長くて 30 秒。画面が落ち着いたら撮る（クラウドの Mac のシミュレーターは描くのが遅い）
            waited=0
            while [ $waited -lt 30 ]; do
              sleep 1; waited=$((waited + 1))
              if [ $waited -ge 8 ] && settled "$LOG"; then break; fi
            done
            echo "shot after ${waited}s" >> "$LOG"
            # 画面が止まったまま（または何も出していない）なら、そのときのアプリの流れを 3 秒取っておく
            PID=$(awk '/: [0-9]+$/ {print $NF}' /tmp/launch.txt | tail -1)
            if [ "$waited" -ge 30 ] && [ -n "$PID" ]; then
              limit 40 sudo sample "$PID" 3 -file "shots/logs/$LABEL-$s-sample.txt" < /dev/null > /dev/null 2>&1 || echo "sample failed" >> "$LOG"
              [ -f "shots/logs/$LABEL-$s-sample.txt" ] && sudo chmod a+r "shots/logs/$LABEL-$s-sample.txt"
            fi
            limit 60 xcrun simctl io "$UDID" screenshot "shots/$LABEL-$s.png" > /dev/null || echo "::warning title=見本::$LABEL の $s を撮れませんでした"
          done
          # 落ちた記録があれば、どこで落ちたかを出す
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*GrafityGate* 2>/dev/null | head -3); do
            python3 - "$f" <<'PY'
          import json, sys
          path = sys.argv[1]
          text = open(path, errors="replace").read()
          try:
              head, body = text.split("\n", 1)
              data = json.loads(body)
              exc = data.get("exception", {})
              thread = next((t for t in data.get("threads", []) if t.get("triggered")), {})
              images = data.get("usedImages", [])
              frames = []
              for fr in thread.get("frames", [])[:14]:
                  img = images[fr.get("imageIndex", 0)].get("name", "?") if images else "?"
                  frames.append(f'{img} {fr.get("symbol", "")}')
              msg = f'{exc.get("type")} {exc.get("signal")} {data.get("asi", "")}\n' + "\n".join(frames)
          except Exception as e:
              msg = text[:3000]
          print("::warning title=落ちた記録::" + msg.replace("%", "%25").replace("\n", "%0A")[:3800])
          PY
          done
          echo "::notice title=見本::$LABEL で $(ls shots/*.png 2>/dev/null | wc -l | tr -d ' ') 枚を撮りました"

      - name: 撮ったものを渡す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.label }}
          path: shots
          retention-days: 3
          if-no-files-found: ignore

  publish:
    needs: shoot
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 受け取る
        uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: shots

      - name: shots ブランチに置く
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p shots
          cd shots
          git init -q
          git checkout -q -b shots
          printf '画面の見本（%s）\n' "$GITHUB_SHA" > README.md
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "画面の見本 ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" shots
